      <stop offset="1" stop-color="#08A8D5"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 432) rotate(90) scale(430)">
